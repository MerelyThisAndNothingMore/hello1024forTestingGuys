<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试工程师节日祝福</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        emerald: {
                            900: '#064e3b',
                            800: '#065f46',
                            700: '#047857',
                            600: '#059669',
                            500: '#10b981',
                            400: '#34d399',
                            300: '#6ee7b7',
                            200: '#a7f3d0',
                            100: '#d1fae5'
                        },
                        green: {
                            900: '#0f766e',
                            800: '#15803d',
                            700: '#166534',
                            600: '#16a34a',
                            500: '#22c55e',
                            400: '#4ade80',
                            300: '#86efac',
                            200: '#bbf7d0',
                            100: '#dcfce7'
                        }
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .bg-gradient-emerald {
                background: linear-gradient(to-br, #064e3b, #0f766e);
            }
            .text-gradient-green {
                background-clip: text;
                -webkit-background-clip: text;
                color: transparent;
                background-image: linear-gradient(to-r, #6ee7b7, #34d399);
            }
            .card-glass {
                backdrop-filter: blur(8px);
                background-color: rgba(6, 78, 59, 0.5);
                border-color: rgba(4, 120, 87, 0.3);
            }
        }
    </style>
</head>

<body class="relative min-h-screen overflow-hidden bg-gradient-to-br from-emerald-900 to-green-900 text-white">
    <!-- 粒子背景 -->
    <canvas id="particleCanvas" class="absolute top-0 left-0 w-full h-full opacity-30"></canvas>

    <div class="relative z-10 container mx-auto px-4 py-12 max-w-4xl">
        <!-- 标题 -->
        <header class="text-center mb-16">
            <h1
                class="text-4xl md:text-6xl font-bold mb-4 bg-clip-text text-transparent bg-gradient-to-r from-green-300 to-emerald-400">
                测试工程师节日祝福
            </h1>
            <p class="text-xl text-emerald-200">致所有保障产品质量的质量守护者</p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <!-- 节日卡片 -->
            <div class="card-glass rounded-lg border p-6">
                <div class="flex items-center mb-4">
                    <div class="bg-emerald-500 p-3 rounded-full mr-4">
                        <span class="text-2xl">🔍</span>
                    </div>
                    <h2 class="text-2xl font-semibold">特别致敬</h2>
                </div>

                <p class="mb-6 text-emerald-100 leading-relaxed">
                    在这个特别的日子，向所有默默守护产品质量的测试工程师致敬！
                    愿你们的测试用例覆盖全面，bug无处遁形；
                    愿你们的回归测试顺利通过，上线发布平安无事。
                </p>

                <div class="flex flex-wrap gap-2">
                    {['✅', '🔍', '🛡️', '📊', '📝', '🚀'].map((emoji, i) => (
                    <span key={i} class="text-2xl animate-bounce" style={{ animationDelay: `${i * 0.2}s` }}>
                        {emoji}
                    </span>
                    ))}
                </div>
            </div>

            <!-- 互动测试用例 -->
            <div class="card-glass rounded-lg border p-6">
                <div class="flex items-center mb-4">
                    <div class="bg-green-500 p-3 rounded-full mr-4">
                        <span class="text-2xl">💌</span>
                    </div>
                    <h2 class="text-2xl font-semibold">发送祝福</h2>
                </div>

                <p class="mb-4 text-green-100">
                    编写你的祝福测试用例，给测试同学一个惊喜！
                </p>

                <div class="mb-4 bg-gray-900 rounded-md p-4 font-mono text-sm">
                    <textarea id="testInput" class="w-full bg-gray-900 text-green-400 border-none focus:ring-0" rows="5"
                        placeholder="输入你的祝福测试用例...">assert(节日快乐 === true);</textarea>
                </div>

                <button id="runTestBtn"
                    class="w-full bg-gradient-to-r from-green-600 to-emerald-500 hover:from-green-700 hover:to-emerald-600 py-2 px-4 rounded-md transition duration-300">
                    执行祝福测试
                </button>
            </div>
        </div>
    </div>

    <!-- 祝福弹窗 -->
    <div id="blessingDialog" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div
            class="bg-gradient-to-br from-emerald-800 to-green-900 border border-emerald-600/30 rounded-lg p-6 max-w-md w-full mx-4">
            <div class="mb-4">
                <h3 class="text-2xl font-bold">✅ 祝福测试通过！</h3>
                <p class="text-emerald-200 mt-2">你的测试同学已经收到你的祝福</p>
            </div>
            <div class="py-4 text-center">
                <p class="text-xl mb-4">祝所有测试工程师：</p>
                <p
                    class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-green-300 to-emerald-300">
                    Bug无处藏身，上线平安无事！
                </p>
            </div>
            <div class="mt-6 text-right">
                <button id="closeDialogBtn"
                    class="bg-gradient-to-r from-purple-500 to-blue-500 py-2 px-4 rounded-md transition duration-300">
                    关闭
                </button>
            </div>
        </div>
    </div>

    <script>
        // 粒子背景效果
        document.addEventListener('DOMContentLoaded', function () {
            const canvas = document.getElementById('particleCanvas');
            if (!canvas) return;

            const ctx = canvas.getContext('2d');
            if (!ctx) return;

            // 设置canvas尺寸
            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }

            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            // 创建粒子
            const particles = [];
            const particleCount = 100;

            for (let i = 0; i < particleCount; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random() * 3 + 1,
                    speed: Math.random() * 2 + 0.5,
                    angle: Math.random() * Math.PI * 2,
                    color: `hsl(${Math.random() * 60 + 100}, 70%, 60%)` // 绿色系
                });
            }

            // 绘制粒子
            function drawParticles() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                particles.forEach(p => {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.fill();

                    // 更新位置
                    p.x += Math.cos(p.angle) * p.speed;
                    p.y += Math.sin(p.angle) * p.speed;

                    // 边界检查
                    if (p.x < 0 || p.x > canvas.width || p.y < 0 || p.y > canvas.height) {
                        p.x = Math.random() * canvas.width;
                        p.y = Math.random() * canvas.height;
                    }
                });

                requestAnimationFrame(drawParticles);
            }

            drawParticles();

            // 弹窗功能
            const dialog = document.getElementById('blessingDialog');
            const runTestBtn = document.getElementById('runTestBtn');
            const closeDialogBtn = document.getElementById('closeDialogBtn');
            const testInput = document.getElementById('testInput');

            if (runTestBtn && dialog && closeDialogBtn && testInput) {
                runTestBtn.addEventListener('click', function () {
                    const inputText = testInput.value;
                    if (inputText.includes('节日快乐') || inputText.includes('happy')) {
                        dialog.classList.remove('hidden');
                    }
                });

                closeDialogBtn.addEventListener('click', function () {
                    dialog.classList.add('hidden');
                });

                // 点击弹窗外部关闭
                dialog.addEventListener('click', function (e) {
                    if (e.target === dialog) {
                        dialog.classList.add('hidden');
                    }
                });
            }
        });
    </script>
</body>

</html>
