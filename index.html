<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1024程序员节 - 来自开发同学的祝福</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        emerald: {
                            900: '#064e3b',
                            800: '#065f46',
                            700: '#047857',
                            600: '#059669',
                            500: '#10b981',
                            400: '#34d399',
                            300: '#6ee7b7',
                            200: '#a7f3d0',
                            100: '#d1fae5'
                        },
                        green: {
                            900: '#0f766e',
                            800: '#15803d',
                            700: '#166534',
                            600: '#16a34a',
                            500: '#22c55e',
                            400: '#4ade80',
                            300: '#86efac',
                            200: '#bbf7d0',
                            100: '#dcfce7'
                        }
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .card-glass {
                backdrop-filter: blur(8px);
                background-color: rgba(6, 78, 59, 0.5);
                border-color: rgba(4, 120, 87, 0.3);
            }
        }
    </style>
</head>

<body class="relative min-h-screen overflow-hidden bg-gradient-to-br from-emerald-900 to-green-900 text-white">
    <!-- 粒子背景 -->
    <canvas id="particleCanvas" class="absolute top-0 left-0 w-full h-full opacity-30"></canvas>

    <div class="relative z-10 container mx-auto px-4 py-12 max-w-4xl">
        <!-- 标题 -->
        <header class="text-center mb-16">
            <h1
                class="text-4xl md:text-6xl font-bold mb-4 bg-clip-text text-transparent bg-gradient-to-r from-green-300 to-emerald-400">
                1024程序员节快乐
            </h1>
            <p class="text-xl text-emerald-200">来自开发同学的特别祝福</p>
        </header>

        <!-- 节日卡片 -->
        <div class="card-glass rounded-lg border max-w-2xl mx-auto">
            <div class="p-8">
                <div class="flex items-center mb-6">
                    <div class="bg-emerald-500 p-3 rounded-full mr-4">
                        <span class="text-2xl">🤝</span>
                    </div>
                    <h2 class="text-2xl font-semibold">致我们最棒的朱海超同学</h2>
                </div>

                <div class="space-y-4 text-emerald-100 leading-relaxed">
                    <p>
                        感谢你一直以来的辛勤付出，是你们的严谨测试让我们的代码更加可靠！
                    </p>
                    <p>
                        在1024程序员节这个特别的日子，我们想对你说：
                    </p>
                    <p class="text-center text-xl font-medium text-emerald-300">
                        "没有你发现的bug，就没有我们成长的动力！"
                    </p>
                    <p>
                        愿你的测试用例永远精准，回归测试永远顺利，
                        愿我们继续携手打造更优质的产品！
                    </p>
                </div>

                <div class="mt-8 flex justify-center">
                    <button id="showBlessingBtn"
                        class="bg-gradient-to-r from-green-600 to-emerald-500 hover:from-green-700 hover:to-emerald-600 px-8 py-3 text-lg rounded-md transition duration-300">
                        查看特别祝福
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 祝福弹窗 -->
    <div id="blessingDialog" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div
            class="bg-gradient-to-br from-emerald-800 to-green-900 border border-emerald-600/30 rounded-lg p-6 max-w-md w-full mx-4">
            <div class="mb-4">
                <h3 class="text-2xl font-bold">🎉 特别祝福 🎉</h3>
                <p class="text-emerald-200 mt-2">来自开发团队的心意</p>
            </div>
            <div class="py-6 text-center space-y-4">
                <p class="text-xl">
                    感谢你帮我们找出那些"隐藏功能"，
                </p>
                <p
                    class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-green-300 to-emerald-300">
                    你是我们代码质量的守护神！
                </p>
                <p class="text-lg mt-4">
                    1024程序员节快乐！
                </p>
            </div>
            <div class="mt-6 text-right">
                <button id="closeDialogBtn"
                    class="bg-gradient-to-r from-emerald-500 to-green-500 py-2 px-4 rounded-md transition duration-300">
                    关闭
                </button>
            </div>
        </div>
    </div>

    <script>
        // 粒子背景效果
        document.addEventListener('DOMContentLoaded', function () {
            const canvas = document.getElementById('particleCanvas');
            if (!canvas) return;

            const ctx = canvas.getContext('2d');
            if (!ctx) return;

            // 设置canvas尺寸
            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }

            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            // 创建粒子
            const particles = [];
            const particleCount = 100;

            for (let i = 0; i < particleCount; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random() * 3 + 1,
                    speed: Math.random() * 2 + 0.5,
                    angle: Math.random() * Math.PI * 2,
                    color: `hsl(${Math.random() * 60 + 100}, 70%, 60%)` // 绿色系
                });
            }

            // 绘制粒子
            function drawParticles() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                particles.forEach(p => {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.fill();

                    // 更新位置
                    p.x += Math.cos(p.angle) * p.speed;
                    p.y += Math.sin(p.angle) * p.speed;

                    // 边界检查
                    if (p.x < 0 || p.x > canvas.width || p.y < 0 || p.y > canvas.height) {
                        p.x = Math.random() * canvas.width;
                        p.y = Math.random() * canvas.height;
                    }
                });

                requestAnimationFrame(drawParticles);
            }

            drawParticles();

            // 弹窗功能
            const dialog = document.getElementById('blessingDialog');
            const showBtn = document.getElementById('showBlessingBtn');
            const closeBtn = document.getElementById('closeDialogBtn');

            if (dialog && showBtn && closeBtn) {
                showBtn.addEventListener('click', function () {
                    dialog.classList.remove('hidden');
                });

                closeBtn.addEventListener('click', function () {
                    dialog.classList.add('hidden');
                });

                // 点击弹窗外部关闭
                dialog.addEventListener('click', function (e) {
                    if (e.target === dialog) {
                        dialog.classList.add('hidden');
                    }
                });
            }
        });
    </script>
</body>

</html>
